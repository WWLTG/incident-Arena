apiVersion: v1
kind: Pod
metadata:
  name: arena-client
  namespace: incident-arena-04
  labels:
    app: arena-client
spec:
  containers:
    - name: client
      image: busybox:1.36
      command:
        - sh
        - -c
        - sleep 36000
      resources:
        requests:
          cpu: 5m
          memory: 8Mi
        limits:
          cpu: 30m
          memory: 32Mi
