apiVersion: apps/v1
kind: Deployment
metadata:
  name: arena-web
  namespace: incident-arena-08
spec:
  replicas: 1
  selector:
    matchLabels:
      app: arena-web
  template:
    metadata:
      labels:
        app: arena-web
        tier: frontend
    spec:
      containers:
        - name: web
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /www
              printf 'application=arena-web\nenvironment=%s\nstatus=running\n' "$APP_ENV" > /www/index.html
              exec httpd -f -p 8080 -h /www
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: arena-web-config
                  key: app-environment
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
