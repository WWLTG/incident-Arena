apiVersion: v1
kind: LimitRange
metadata:
  name: arena-resource-limits
  namespace: incident-arena-08
spec:
  limits:
    - type: Container
      max:
        cpu: "500m"
        memory: "256Mi"
      min:
        cpu: "50m"
        memory: "32Mi"
      default:
        cpu: "250m"
        memory: "128Mi"
      defaultRequest:
        cpu: "100m"
        memory: "64Mi"
