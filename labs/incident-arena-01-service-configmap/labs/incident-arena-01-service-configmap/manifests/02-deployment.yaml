apiVersion: apps/v1
kind: Deployment
metadata:
  name: arena-web
  namespace: incident-arena-01
spec:
  replicas: 1
  selector:
    matchLabels:
      app: arena-web
  template:
    metadata:
      labels:
        app: arena-web
        tier: frontend
    spec:
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: web-content
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: web-content
          configMap:
            name: arena-web-config
