apiVersion: batch/v1
kind: CronJob
metadata:
  name: arena-report
  namespace: incident-arena-05
spec:
  schedule: "*/5 * * * *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: arena-report
        spec:
          serviceAccountName: arena-reporter
          restartPolicy: Never
          containers:
            - name: reporter
              image: registry.k8s.io/kubectl:v1.36.1
              imagePullPolicy: IfNotPresent
              args:
                - get
                - configmap
                - arena-report-config
                - -n
                - incident-arena-05
                - -o
                - 'jsonpath=report_message={.data.report_message}{"\n"}'
                - --allow-missing-template-keys=false
