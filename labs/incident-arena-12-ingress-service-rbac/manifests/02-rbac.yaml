apiVersion: v1
kind: ServiceAccount
metadata:
  name: flag-reader
  namespace: incident-arena-12
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: configmap-reader
  namespace: incident-arena-12
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flag-reader-binding
  namespace: incident-arena-12
subjects:
  - kind: ServiceAccount
    name: flag-reader
    namespace: incident-arena-12
roleRef:
  kind: Role
  name: configmap-reader
  apiGroup: rbac.authorization.k8s.io
