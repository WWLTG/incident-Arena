apiVersion: v1
kind: Pod
metadata:
  name: arena-client
  namespace: incident-arena-10
spec:
  containers:
    - name: client
      image: busybox:1.36
      command:
        - sh
        - -c
        - sleep 36000
      resources:
        requests:
          cpu: 5m
          memory: 8Mi
        limits:
          cpu: 20m
          memory: 16Mi
  restartPolicy: Never
